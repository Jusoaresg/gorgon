{{ define "settings" }}
{{ $type := .Data.TypeString }}

<div class="settings-container">
    <div class="settings-header">
        <h1>Settings</h1>
        <p class="text-secondary">settings for your download clients and indexers</p>
    </div>

    <div class="settings-grid">
        <!-- Sidebar for settings sections -->
        <aside class="settings-nav">
            <a href="/settings/gorgon" class="nav-item {{ if eq $type "gorgonSettings"}}active{{ end }}">General</a>
            <a href="/settings/torrent" class="nav-item {{ if eq $type "torrentSettings"}}active{{ end }}">qBittorrent</a>
            <a href="/settings/prowlarr" class="nav-item {{ if eq $type "prowlarrSettings"}}active{{ end }}">Prowlarr</a>
            <a href="/settings/telegram" class="nav-item {{ if eq $type "telegramSettings"}}active{{ end }}">Telegram</a>
            <a href="/settings/filter" class="nav-item {{ if eq $type "filterSettings"}}active{{ end }}">Filters</a>
        </aside>

        {{ render $type .Data.Settings }}

        </div>
    </div>
</div>
{{ end }}
