name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Go deps
        run: go mod download

      - name: Install swag (docs)
        run: |
          if ! command -v swag &> /dev/null; then
            go install github.com/swaggo/swag/cmd/swag@v1.16.6
          fi

      - name: Check ( tests + lint )
        run: make check

      - name: Build for local validation
        run: make build

      - name: Cross build for releases
        run: make cross-build

      - name: Scan Go vulnerabilities (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
