basePath: /api/v1
definitions:
  api.addShowAliasRequest:
    properties:
      alias:
        type: string
    type: object
  schema.AddNewTorrentRequest:
    properties:
      magneticUrl:
        type: string
    type: object
  schema.ChangeEpisodeTrackingRequest:
    properties:
      episode_ids:
        items:
          type: integer
        type: array
      tracking:
        type: string
    type: object
  schema.CheckTorrentResponse:
    properties:
      added_on:
        type: integer
      amount_left:
        type: integer
      category:
        type: string
      completed:
        type: integer
      completedon:
        type: integer
      contentpath:
        type: string
      dlspeed:
        type: integer
      eta:
        type: integer
      hash:
        type: string
      name:
        type: string
      num_leechs:
        type: integer
      num_seeds:
        type: integer
      progress:
        type: number
      save_path:
        type: string
      size:
        type: integer
      state:
        type: string
      time_active:
        type: integer
      upspeed:
        type: integer
    type: object
  schema.FilterPatternDto:
    properties:
      kind:
        type: string
      pattern:
        type: string
      score:
        type: integer
    type: object
  schema.FilterSettingsDto:
    properties:
      default_filter_profile_id:
        type: string
      only_latin:
        type: boolean
      use_aliases:
        type: boolean
    type: object
  schema.IndexerResponse:
    properties:
      definitionName:
        type: string
      enable:
        type: boolean
      id:
        type: integer
      indexerUrls:
        items:
          type: string
        type: array
      language:
        type: string
      name:
        type: string
    type: object
  schema.SaveFilterProfileRequest:
    properties:
      name:
        type: string
      patterns:
        items:
          $ref: '#/definitions/schema.FilterPatternDto'
        type: array
    type: object
  schema.SearchRequest:
    properties:
      query:
        type: string
    type: object
  schema.SearchResponse:
    properties:
      age:
        type: number
      ageHours:
        type: number
      ageMinutes:
        type: number
      fileName:
        type: string
      grabs:
        type: integer
      guid:
        type: string
      indexer:
        type: string
      indexerId:
        type: integer
      infoHash:
        type: string
      infoUrl:
        type: string
      leechers:
        type: integer
      magnetUrl:
        type: string
      protocol:
        type: string
      publishDate:
        type: string
      seeders:
        type: integer
      size:
        type: integer
      title:
        type: string
    type: object
  schema.ShowSettingsDto:
    properties:
      filter_profile_id:
        type: integer
      only_latin:
        type: boolean
      search_patterns:
        items:
          type: string
        type: array
      use_aliases:
        type: boolean
    type: object
  schemas.ConfigFile:
    properties:
      defaultShowInfoFolder:
        type: string
      prowlarrApiKey:
        type: string
      prowlarrHost:
        type: string
      prowlarrPort:
        type: string
      qBittorrentDownloadFolder:
        type: string
      qBittorrentHost:
        type: string
      qBittorrentPassword:
        type: string
      qBittorrentPort:
        type: string
      qBittorrentUsername:
        type: string
      showsFolder:
        type: string
    type: object
  schemas.DefaultResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  schemas.ErrorResponse:
    properties:
      data:
        type: string
      message:
        type: string
    type: object
  schemas.IdRequest:
    properties:
      id:
        type: integer
    type: object
  schemas.NameRequest:
    properties:
      name:
        type: string
    type: object
  show.AddShowToListRequest:
    properties:
      id:
        type: integer
      tracking_type:
        type: string
    type: object
info:
  contact:
